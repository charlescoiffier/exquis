services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: exquis
      POSTGRES_PASSWORD: exquis
      POSTGRES_DB: exquis
    ports: ["5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  dbdata:
